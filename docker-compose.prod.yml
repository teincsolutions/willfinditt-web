services:
  willfinditt-web:
    image: ${DOCKER_IMAGE:-teincsolutions/willfind8-web}:${DOCKER_TAG:-latest}
    container_name: willfinditt-web-prod
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - wf8-internal-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.willfinditt.service=web"
      - "com.willfinditt.version=${DOCKER_TAG:-latest}"

networks:
  wf8-internal-net:
    external: true
