version: '3.8'

services:
  willfinditt-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-teincsolutions/willfind8-web}:${DOCKER_TAG:-latest}
    container_name: willfinditt-web-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
    networks:
      - wf8-internal-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.willfinditt.service=web"
      - "com.willfinditt.version=${DOCKER_TAG:-latest}"

networks:
  wf8-internal-net:
    external: true
