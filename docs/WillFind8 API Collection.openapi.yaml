          description: ''
          required: true
          example: application/json
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                username:
                  type: string
                password:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
              required:
                - email
                - username
                - password
                - firstName
                - lastName
            example:
              email: user1@example.com
              username: user1
              password: password123
              firstName: John
              lastName: Doe
      responses:
        '200':
          description: ''
          content:
            application/json:
